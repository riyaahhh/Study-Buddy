# App
spring.application.name=studybuddy-backend
server.port=8080
server.error.include-stacktrace=never

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/studybuddy_db
spring.datasource.username=studybuddy_user
spring.datasource.password=studybuddy123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (we'll use this on Day 4)
jwt.secret=studybuddy_super_secret_key_change_this_in_production
jwt.expiration=86400000